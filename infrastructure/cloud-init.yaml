#cloud-config
# =============================================================================
# Sovereign Collaboration Platform — Phase 1 baseline (Keycloak host)
# =============================================================================
# This file is PUBLIC and committed to Git. It must NEVER contain secrets.
#
# It does ONLY the minimum that xneelo's user-data filter accepts:
#   - creates the admin user + installs the SSH public key
#   - baseline SSH hardening via NATIVE directives (no system-file write)
#   - installs base packages and sets the firewall (22/80/443)
#   - clones the PUBLIC config repo to /opt/sovereign-cloud
#
# Privileged system changes that xneelo BLOCKS in user-data are deferred to
# scripts/bootstrap.sh, which runs after boot where no payload filter applies:
#   - installing Docker      (writes system apt config)
#   - full SSH hardening drop-in (writes sshd config)
#
# cloud-init does NOT bring up the app stack — that needs the .env secrets
# you supply by hand.
#
# HOW TO USE: paste the entire contents into xneelo's "config script /
# user-data" field when creating the instance.
#
# EDIT BEFORE PASTING:
#   1. ssh_authorized_keys -> your real public key
#      (contents of ~/.ssh/sovereign-cloud-admin.pub)
#   2. fqdn -> your real DNS name (optional, cosmetic)
# =============================================================================

hostname: auth
fqdn: auth.growth-x.business      # <-- your real DNS name
timezone: Africa/Johannesburg
package_update: true
package_upgrade: true

users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-rsa  Generated-by-Nova

# Baseline SSH hardening via native cloud-init directives. These are
# filter-safe (no system-config path appears in the payload). bootstrap.sh adds
# the full hardening drop-in after boot.
ssh_pwauth: false
disable_root: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - restic

runcmd:
  # Firewall: default deny inbound, allow SSH/HTTP/HTTPS only
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  # Clone the PUBLIC config repo (no credentials needed)
  - git clone https://github.com/HinrichF/sovereignCloud.git /opt/sovereign-cloud
  - chown -R admin:admin /opt/sovereign-cloud

final_message: |
  ============================================================
  Baseline ready. Next steps (as the 'admin' user over SSH):
    1. cd /opt/sovereign-cloud/keycloak
    2. cp .env.example .env  &&  edit .env with real secrets
    3. sudo /opt/sovereign-cloud/scripts/bootstrap.sh
       (installs Docker, hardens SSH, preps the data volume,
        and brings up Keycloak)
    4. (rebuild only) sudo /opt/sovereign-cloud/scripts/restore.sh
  ============================================================